get:
  operationId: getSecurityPrivilegeCatalog
  tags: [security]
  summary: List provider declared privileges
  parameters:
    - name: connectionId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    '200':
      description: Provider declared database and table privileges.
      content:
        application/json:
          schema: { $ref: ../components/schemas/security.yaml#/PrivilegeCatalog }
    '401':
      {
        description: Authentication required,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '403':
      {
        description: Connection ownership or provider permission failed,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '409':
      {
        description: Connection is not connected,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '501':
      {
        description: Grant capability is unavailable,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
