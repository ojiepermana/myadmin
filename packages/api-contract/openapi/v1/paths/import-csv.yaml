post:
  operationId: createImportCsv
  tags: [imports]
  summary: Queue a parameterized CSV import job
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/import.yaml#/ImportCsvRequest }
  responses:
    '202':
      description: Import job queued.
      content:
        {
          application/json:
            { schema: { $ref: ../components/schemas/import.yaml#/ImportCreateResponse } },
        }
    '401':
      {
        description: No valid session was provided.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '403':
      {
        description: CSRF validation failed.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '404':
      {
        description: Upload was not found.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '409':
      {
        description: Destructive confirmation or job limit conflict.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '422':
      {
        description: Import request or mapping is invalid.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '501':
      {
        description: Provider import is unavailable.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
