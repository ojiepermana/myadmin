post:
  operationId: changePassword
  tags:
    - auth
  summary: Change the current user's password
  parameters:
    - in: header
      name: X-Myadmin-Csrf
      required: true
      schema:
        type: string
        enum: ['1']
      description: Same-origin mutation marker required for cookie-authenticated requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/user.yaml#/ChangePasswordRequest
  responses:
    '204':
      description: Password changed and other sessions revoked.
    '409':
      description: Initial setup is required before changing a password.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '401':
      description: The session or current password is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The CSRF or origin check failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: Password policy validation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '500':
      description: Password could not be changed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
