post:
  operationId: createBackup
  tags: [backups]
  summary: Queue a native database backup
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/backup.yaml#/BackupCreateRequest
  responses:
    '202':
      description: Backup job queued.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/backup.yaml#/BackupCreateResponse
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: CSRF or connection ownership failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: Request validation or saved credential validation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '501':
      description: Native backup tooling is unavailable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
