get:
  operationId: getHealth
  tags:
    - system
  summary: Get application health
  security: []
  responses:
    '200':
      description: Application health.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/health.yaml
    '503':
      description: Application is not ready.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
