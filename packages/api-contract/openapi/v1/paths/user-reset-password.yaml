post:
  operationId: resetUserPassword
  tags:
    - users
  summary: Reset a user's password for administrators
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        minLength: 1
    - in: header
      name: X-Myadmin-Csrf
      required: true
      schema:
        type: string
        enum: ['1']
      description: Same-origin mutation marker required for cookie-authenticated requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/user.yaml#/ResetPasswordRequest
  responses:
    '204':
      description: Password reset and all target sessions revoked.
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The current user is not an administrator or CSRF validation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '404':
      description: The user was not found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: Password validation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '500':
      description: Password could not be reset.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
