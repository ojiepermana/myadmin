delete:
  operationId: dropTable
  tags: [tables]
  summary: Drop a table after exact name confirmation without cascade
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/table-operations.yaml#/TableDropRequest
  responses:
    '204':
      description: Table dropped and audit recorded.
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The request failed CSRF or ownership checks.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '409':
      description: Confirmation was wrong or the provider rejected dependencies.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: The table reference is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '501':
      description: Table operations are not supported by this provider.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '502':
      description: The provider operation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
