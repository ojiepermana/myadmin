post:
  operationId: createInitialAdmin
  tags:
    - setup
  summary: Create the initial administrator
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/user.yaml#/SetupAdminRequest
  responses:
    '201':
      description: Initial administrator created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/user.yaml#/AuthResponse
    '409':
      description: The application is already initialized.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '500':
      description: Administrator could not be created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
