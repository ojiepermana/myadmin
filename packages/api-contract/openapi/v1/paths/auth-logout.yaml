post:
  operationId: logout
  tags:
    - auth
  summary: End the current application session
  parameters:
    - in: header
      name: X-Myadmin-Csrf
      required: true
      schema:
        type: string
        enum: ['1']
      description: Same-origin mutation marker required for cookie-authenticated requests.
  responses:
    '204':
      description: Session ended.
    '409':
      description: Initial setup is required before logout.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The CSRF or origin check failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '500':
      description: Session could not be ended.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
