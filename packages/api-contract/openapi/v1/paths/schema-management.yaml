post:
  operationId: createSchema
  tags: [schemas]
  summary: Create a schema
  parameters:
    - $ref: ../components/parameters/connection-id.yaml
    - name: db
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/schema.yaml#/SchemaCreateRequest
  responses:
    '201':
      description: Schema created and audit recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/schema.yaml#/Schema
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The request failed CSRF or ownership checks.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '409':
      description: The schema already exists or the connection is not connected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: The request body or identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '501':
      description: The provider does not support schema management.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '502':
      description: The provider operation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
