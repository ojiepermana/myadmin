post:
  operationId: getTableDestructiveImpact
  tags: [tables]
  summary: Inspect table destructive operation impact
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/table-operations.yaml#/TableImpactRequest
  responses:
    '200':
      description: Provider metadata used by destructive action dialogs.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/table-operations.yaml#/TableDestructiveImpact
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The connection belongs to another user.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '409':
      description: The connection is not connected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: The table reference is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
