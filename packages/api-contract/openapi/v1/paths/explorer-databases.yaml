get:
  operationId: listExplorerDatabases
  tags: [object-explorer]
  summary: List databases for a connected saved connection
  parameters:
    - $ref: ../components/parameters/connection-id.yaml
    - $ref: ../components/parameters/explorer-page.yaml
    - $ref: ../components/parameters/explorer-page-size.yaml
    - $ref: ../components/parameters/explorer-refresh.yaml
  responses:
    '200':
      description: One page of provider metadata databases.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/explorer.yaml#/ExplorerDatabasePage
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The connection belongs to another user.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '404':
      description: The connection does not exist.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '409':
      description: The connection is not connected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: Pagination values are invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '502':
      description: The provider metadata operation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
post:
  operationId: createDatabase
  tags: [databases]
  summary: Create a database using provider supplied options
  parameters:
    - $ref: ../components/parameters/connection-id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/database.yaml#/DatabaseCreateRequest
  responses:
    '201':
      description: Database created and audit recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/database.yaml#/Database
    '401':
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '403':
      description: The request failed CSRF or ownership checks.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '409':
      description: The database already exists or the connection is not connected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '422':
      description: The request body is invalid or a provider option is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
    '502':
      description: The provider operation failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api-error.yaml
