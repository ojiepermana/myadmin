get:
  operationId: previewImport
  tags: [imports]
  summary: Read a bounded server side import preview
  parameters:
    - name: uploadId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    - name: format
      in: query
      required: false
      schema: { type: string, enum: [sql, csv] }
    - name: delimiter
      in: query
      required: false
      schema: { type: string, enum: [',', ';', '\t'] }
    - name: header
      in: query
      required: false
      schema: { type: boolean }
  responses:
    '200':
      description: At most twenty CSV rows or the first SQL statement.
      content:
        { application/json: { schema: { $ref: ../components/schemas/import.yaml#/ImportPreview } } }
    '401':
      {
        description: No valid session was provided.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '404':
      {
        description: Upload was not found or is not owned by the caller.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '410':
      {
        description: Upload expired.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '422':
      {
        description: Preview request is invalid.,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
