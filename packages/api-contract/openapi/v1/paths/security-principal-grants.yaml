get:
  operationId: listSecurityPrincipalGrants
  tags: [security]
  summary: List effective grants for a database principal
  parameters:
    - name: name
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    - name: connectionId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    '200':
      description: Effective database and table grants.
      content:
        application/json:
          schema: { $ref: ../components/schemas/security.yaml#/GrantPage }
    '401':
      {
        description: Authentication required,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '403':
      {
        description: Connection ownership or provider permission failed,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '409':
      {
        description: Connection is not connected,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '422':
      {
        description: Validation failed,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '501':
      {
        description: Grant capability is unavailable,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
