post:
  operationId: previewSecurityGrants
  tags: [security]
  summary: Preview privilege grant and revoke statements
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/security.yaml#/GrantRequest }
  responses:
    '200':
      description: Provider compiled statements.
      content:
        application/json:
          schema: { $ref: ../components/schemas/security.yaml#/GrantPreview }
    '401':
      {
        description: Authentication required,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '403':
      {
        description: CSRF or provider permission failed,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '409':
      {
        description: Connection is not connected,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '422':
      {
        description: Validation failed,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
    '501':
      {
        description: Grant capability is unavailable,
        content: { application/json: { schema: { $ref: ../components/schemas/api-error.yaml } } },
      }
