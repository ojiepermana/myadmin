DataObjectRef:
  type: object
  additionalProperties: false
  required: [database, schema, name, type]
  properties:
    database:
      type: string
      minLength: 1
    schema:
      type: [string, 'null']
    name:
      type: string
      minLength: 1
    type:
      type: string
      enum: [table, view]

DataPage:
  type: object
  additionalProperties: false
  required: [limit, offset, hasMore]
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 500
    offset:
      type: integer
      minimum: 0
    hasMore:
      type: boolean

DataPageInput:
  type: object
  additionalProperties: false
  properties:
    limit:
      type: integer
      minimum: 1
      maximum: 500
    offset:
      type: integer
      minimum: 0

DataSort:
  type: object
  additionalProperties: false
  required: [column, direction]
  properties:
    column:
      type: string
      minLength: 1
    direction:
      type: string
      enum: [asc, desc]

DataFilter:
  type: object
  additionalProperties: false
  required: [column, operator]
  properties:
    column:
      type: string
      minLength: 1
    operator:
      type: string
      enum:
        [
          '=',
          '!=',
          '>',
          '>=',
          '<',
          '<=',
          contains,
          startsWith,
          endsWith,
          'is null',
          'is not null',
          in,
        ]
    value: {}
    values:
      type: array
      minItems: 1
      maxItems: 500
      items: {}

DataTotal:
  type: object
  additionalProperties: false
  required: [value, kind]
  properties:
    value:
      type: integer
      minimum: 0
    kind:
      type: string
      enum: [exact, estimate]

DataColumnMetadata:
  type: object
  additionalProperties: false
  required: [name, dataType, nullable, primary]
  properties:
    name:
      type: string
    dataType:
      type: string
    nullable:
      type: boolean
    primary:
      type: boolean
    position:
      type: integer
    comment:
      type: string
    defaultExpression:
      type: string
    isIdentity:
      type: boolean
    isGenerated:
      type: boolean

DataRowIdentity:
  type: object
  additionalProperties: false
  required: [columns, kind, editable]
  properties:
    columns:
      type: array
      items:
        type: string
    kind:
      type: [string, 'null']
      enum: [primary, unique, null]
    editable:
      type: boolean
    reason:
      type: string

DataInsertRequest:
  type: object
  additionalProperties: false
  required: [connectionId, ref, values]
  properties:
    connectionId:
      type: string
      minLength: 1
    ref:
      $ref: '#/DataObjectRef'
    values:
      $ref: ../schemas/query.yaml#/SerializedDataRow

DataUpdateRequest:
  type: object
  additionalProperties: false
  required: [connectionId, ref, identity, changes]
  properties:
    connectionId:
      type: string
      minLength: 1
    ref:
      $ref: '#/DataObjectRef'
    identity:
      $ref: ../schemas/query.yaml#/SerializedDataRow
    changes:
      $ref: ../schemas/query.yaml#/SerializedDataRow

DataDeleteRequest:
  type: object
  additionalProperties: false
  required: [connectionId, ref, identities]
  properties:
    connectionId:
      type: string
      minLength: 1
    ref:
      $ref: '#/DataObjectRef'
    identities:
      type: array
      minItems: 1
      maxItems: 500
      items:
        $ref: ../schemas/query.yaml#/SerializedDataRow

DataMutationResponse:
  type: object
  additionalProperties: false
  required: [affectedRows]
  properties:
    affectedRows:
      type: integer
      minimum: 0
    row:
      $ref: ../schemas/query.yaml#/SerializedDataRow

DataReadRequest:
  type: object
  additionalProperties: false
  required: [connectionId, ref]
  properties:
    connectionId:
      type: string
      minLength: 1
    ref:
      $ref: '#/DataObjectRef'
    page:
      $ref: '#/DataPageInput'
    sort:
      type: array
      maxItems: 16
      items:
        $ref: '#/DataSort'
    filters:
      type: array
      maxItems: 32
      items:
        $ref: '#/DataFilter'
    search:
      type: string
    columns:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: string
        minLength: 1
    total:
      type: string
      enum: [auto, exact, estimate]

DataReadResponse:
  type: object
  additionalProperties: false
  required: [ref, columns, columnsMeta, rows, total, page, rowIdentity]
  properties:
    ref:
      $ref: '#/DataObjectRef'
    columns:
      type: array
      items:
        type: string
    columnsMeta:
      type: array
      items:
        $ref: '#/DataColumnMetadata'
    rows:
      type: array
      items:
        $ref: ../schemas/query.yaml#/SerializedDataRow
    total:
      $ref: '#/DataTotal'
    page:
      $ref: '#/DataPage'
    rowIdentity:
      $ref: '#/DataRowIdentity'
