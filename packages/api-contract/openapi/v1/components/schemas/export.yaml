ExportObjectRef:
  type: object
  additionalProperties: false
  required: [database, name, type]
  properties:
    database: { type: string, minLength: 1 }
    schema: { type: [string, 'null'] }
    name: { type: string, minLength: 1 }
    type: { type: string, enum: [table, view] }

ExportSource:
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: { const: table }
        ref: { $ref: '#/ExportObjectRef' }
        columns: { type: array, maxItems: 200, items: { type: string, minLength: 1 } }
        filters: { type: array, maxItems: 32, items: { $ref: ../schemas/data.yaml#/DataFilter } }
        sort: { type: array, maxItems: 16, items: { $ref: ../schemas/data.yaml#/DataSort } }
    - type: object
      additionalProperties: false
      required: [kind, sql]
      properties:
        kind: { const: query }
        sql: { type: string, minLength: 1, maxLength: 100000 }
    - type: object
      additionalProperties: false
      required: [kind, ref, keys]
      properties:
        kind: { const: selection }
        ref: { $ref: '#/ExportObjectRef' }
        keys: { type: array, minItems: 1, maxItems: 10000, items: { type: object } }
        columns: { type: array, maxItems: 200, items: { type: string, minLength: 1 } }
    - type: object
      additionalProperties: false
      required: [kind, database]
      properties:
        kind: { const: database }
        database: { type: string, minLength: 1 }
        schema: { type: string, minLength: 1 }

ExportOptions:
  type: object
  additionalProperties: false
  properties:
    delimiter: { type: string, enum: [',', ';', '\t'] }
    header: { type: boolean }
    sqlScope: { type: string, enum: [structure, data, both] }

ExportCreateRequest:
  type: object
  additionalProperties: false
  required: [connectionId, source, format]
  properties:
    connectionId: { type: string, minLength: 1 }
    source: { $ref: '#/ExportSource' }
    format: { type: string, enum: [sql, csv, json] }
    options: { $ref: '#/ExportOptions' }

ExportCreateResponse:
  type: object
  additionalProperties: false
  required: [jobId]
  properties:
    jobId: { type: string, minLength: 1 }

ExportArtifact:
  type: object
  additionalProperties: false
  required: [jobId, fileName, format, sourceLabel, rowCount, sizeBytes, createdAt, expiresAt]
  properties:
    jobId: { type: string, minLength: 1 }
    fileName: { type: string, minLength: 1 }
    format: { type: string, enum: [sql, csv, json] }
    sourceLabel: { type: string, minLength: 1 }
    rowCount: { type: integer, minimum: 0 }
    sizeBytes: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }
