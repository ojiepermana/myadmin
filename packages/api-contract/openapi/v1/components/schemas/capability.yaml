type: object
additionalProperties: false
required:
  - engine
  - version
  - capabilities
properties:
  engine:
    type: string
    enum:
      - postgresql
      - mysql
  version:
    type: string
    minLength: 1
  capabilities:
    type: object
    additionalProperties:
      type: boolean
    description: Provider capability flags keyed by stable feature name.
  reasons:
    type: object
    additionalProperties:
      type: string
    description: Optional safe explanation for capabilities that are unavailable.
