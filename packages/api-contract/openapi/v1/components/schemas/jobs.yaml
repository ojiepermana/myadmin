JobProgress:
  type: object
  additionalProperties: false
  required:
    - phase
    - current
  properties:
    phase:
      type: string
      minLength: 1
    current:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
    message:
      type: string

JobError:
  type: object
  additionalProperties: false
  required:
    - code
    - message
  properties:
    code:
      type: string
      minLength: 1
    message:
      type: string
      minLength: 1

Job:
  type: object
  additionalProperties: false
  required:
    - id
    - type
    - ownerUserId
    - state
    - progress
    - createdAt
    - cancellable
  properties:
    id:
      type: string
      minLength: 1
    type:
      type: string
      minLength: 1
    ownerUserId:
      type: string
      minLength: 1
    state:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelling
        - cancelled
    progress:
      $ref: '#/JobProgress'
    result: {}
    error:
      $ref: '#/JobError'
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    cancellable:
      type: boolean

JobPage:
  type: object
  additionalProperties: false
  required:
    - items
    - page
    - pageSize
    - total
  properties:
    items:
      type: array
      items:
        $ref: '#/Job'
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
    total:
      type: integer
      minimum: 0
