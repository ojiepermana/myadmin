BackupScope:
  type: string
  enum: [structure, data, both]

BackupToolStatus:
  type: object
  additionalProperties: false
  required: [command, available]
  properties:
    command:
      type: string
      minLength: 1
    path:
      type: string
      minLength: 1
    available:
      type: boolean
    version:
      type: string
    major:
      type: integer
      minimum: 0
    reason:
      type: string

BackupCapability:
  type: object
  additionalProperties: false
  required: [supported, backupTool, restoreTool]
  properties:
    supported:
      type: boolean
    serverVersion:
      type: string
    backupTool:
      $ref: '#/BackupToolStatus'
    restoreTool:
      $ref: '#/BackupToolStatus'
    reason:
      type: string
    restoreSqlTool:
      $ref: '#/BackupToolStatus'
    restoreSupported:
      type: boolean
    restoreReason:
      type: string

BackupCreateRequest:
  type: object
  additionalProperties: false
  required: [connectionId, database, scope, compress]
  properties:
    connectionId:
      type: string
      minLength: 1
    database:
      type: string
      minLength: 1
    scope:
      $ref: '#/BackupScope'
    compress:
      type: boolean
    note:
      type: string
      maxLength: 500

BackupCreateResponse:
  type: object
  additionalProperties: false
  required: [jobId]
  properties:
    jobId:
      type: string
      minLength: 1

BackupArtifact:
  type: object
  additionalProperties: false
  required:
    - id
    - fileName
    - connectionId
    - connectionLabel
    - database
    - scope
    - compress
    - sizeBytes
    - createdAt
    - toolVersion
  properties:
    id:
      type: string
      minLength: 1
    fileName:
      type: string
      minLength: 1
    connectionId:
      type: string
      minLength: 1
    connectionLabel:
      type: string
      minLength: 1
    database:
      type: string
      minLength: 1
    scope:
      $ref: '#/BackupScope'
    compress:
      type: boolean
    sizeBytes:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
    toolVersion:
      type: string
      minLength: 1
    note:
      type: string

BackupArtifactPage:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/BackupArtifact'
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
    total:
      type: integer
      minimum: 0

RestoreValidateRequest:
  type: object
  additionalProperties: false
  properties:
    artifactId:
      type: string
      minLength: 1
    uploadId:
      type: string
      minLength: 1
    connectionId:
      type: string
      minLength: 1

RestoreValidation:
  type: object
  additionalProperties: false
  required: [sourceType, sourceId, fileName, format, sizeBytes, detectedEngine, valid]
  properties:
    sourceType:
      type: string
      enum: [artifact, upload]
    sourceId:
      type: string
      minLength: 1
    fileName:
      type: string
      minLength: 1
    format:
      type: string
      enum: [sql, sql.gz]
    sizeBytes:
      type: integer
      minimum: 1
    detectedEngine:
      type: [string, 'null']
      enum: [postgresql, mysql, null]
    valid:
      const: true

RestoreRequest:
  type: object
  additionalProperties: false
  required: [connectionId, targetDatabase, confirmName]
  properties:
    artifactId:
      type: string
      minLength: 1
    uploadId:
      type: string
      minLength: 1
    connectionId:
      type: string
      minLength: 1
    targetDatabase:
      type: string
      minLength: 1
    createNew:
      type: boolean
      default: false
    confirmName:
      type: string
      minLength: 1

RestoreResponse:
  type: object
  additionalProperties: false
  required: [jobId]
  properties:
    jobId:
      type: string
      minLength: 1
