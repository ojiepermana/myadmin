TableType:
  type: object
  additionalProperties: false
  required: [name, label, parameters]
  properties:
    name:
      type: string
    label:
      type: string
    parameters:
      type: array
      items:
        type: string
        enum: [length, precision, scale]

TableDefault:
  type: object
  additionalProperties: false
  required: [kind, value]
  properties:
    kind:
      type: string
      enum: [literal, expression]
    value:
      type: string

TableGenerated:
  type: object
  additionalProperties: false
  required: [expression]
  properties:
    expression:
      type: string
    stored:
      type: boolean

TableColumnInput:
  type: object
  additionalProperties: false
  required: [name, dataType, nullable]
  properties:
    name:
      type: string
    dataType:
      type: string
    length:
      type: integer
      minimum: 1
    precision:
      type: integer
      minimum: 1
    scale:
      type: integer
      minimum: 0
    nullable:
      type: boolean
    default:
      $ref: '#/TableDefault'
    identity:
      type: boolean
    generated:
      $ref: '#/TableGenerated'
    comment:
      type: string
    primaryKey:
      type: boolean

TableColumnPatch:
  type: object
  additionalProperties: false
  properties:
    dataType:
      type: string
    length:
      type: [integer, 'null']
      minimum: 1
    precision:
      type: [integer, 'null']
      minimum: 1
    scale:
      type: [integer, 'null']
      minimum: 0
    nullable:
      type: boolean
    default:
      anyOf:
        - $ref: '#/TableDefault'
        - type: 'null'
    identity:
      type: boolean
    generated:
      anyOf:
        - $ref: '#/TableGenerated'
        - type: 'null'
    comment:
      type: [string, 'null']
    primaryKey:
      type: boolean

TableIndex:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    name:
      type: string
    columns:
      type: array
      minItems: 1
      items:
        type: string
    unique:
      type: boolean

TableIndexMetadata:
  type: object
  additionalProperties: false
  required: [name, columns, unique, primary]
  properties:
    name:
      type: string
    columns:
      type: array
      items:
        type: string
    unique:
      type: boolean
    primary:
      type: boolean
    method:
      type: string
    predicate:
      type: string

TableConstraintMetadata:
  type: object
  additionalProperties: false
  required: [name, type]
  properties:
    name:
      type: string
    type:
      type: string
      enum: [primaryKey, foreignKey, unique, check, notNull, exclusion, other]
    columns:
      type: array
      items:
        type: string
    expression:
      type: string
    referencedTable:
      $ref: './explorer.yaml#/ExplorerObjectRef'
    referencedColumns:
      type: array
      items:
        type: string
    onUpdate:
      type: string
    onDelete:
      type: string

TableConstraint:
  oneOf:
    - type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type:
          const: primaryKey
        name:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: string
    - type: object
      additionalProperties: false
      required: [type, columns, referencedTable, referencedColumns]
      properties:
        type:
          const: foreignKey
        name:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: string
        referencedTable:
          $ref: './explorer.yaml#/ExplorerObjectRef'
        referencedColumns:
          type: array
          minItems: 1
          items:
            type: string
        onDelete:
          type: string
          enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
        onUpdate:
          type: string
          enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
    - type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type:
          const: unique
        name:
          type: string
        columns:
          type: array
          minItems: 1
          items:
            type: string
    - type: object
      additionalProperties: false
      required: [type, expression]
      properties:
        type:
          const: check
        name:
          type: string
        expression:
          type: string

TableAlteration:
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, column]
      properties:
        kind:
          const: add
        column:
          $ref: '#/TableColumnInput'
    - type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          const: drop
        name:
          type: string
    - type: object
      additionalProperties: false
      required: [kind, name, newName]
      properties:
        kind:
          const: rename
        name:
          type: string
        newName:
          type: string
    - type: object
      additionalProperties: false
      required: [kind, name, changes]
      properties:
        kind:
          const: modify
        name:
          type: string
        changes:
          $ref: '#/TableColumnPatch'
    - type: object
      additionalProperties: false
      required: [kind, index]
      properties:
        kind:
          const: addIndex
        index:
          $ref: '#/TableIndex'
    - type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          const: dropIndex
        name:
          type: string
    - type: object
      additionalProperties: false
      required: [kind, constraint]
      properties:
        kind:
          const: addConstraint
        constraint:
          $ref: '#/TableConstraint'
    - type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          const: dropConstraint
        name:
          type: string
        type:
          type: string
          enum: [primaryKey, foreignKey, unique, check]

TableChangeSet:
  type: object
  additionalProperties: false
  required: [operation, ref]
  properties:
    operation:
      type: string
      enum: [create, alter]
    ref:
      $ref: './explorer.yaml#/ExplorerObjectRef'
    columns:
      type: array
      items:
        $ref: '#/TableColumnInput'
    indexes:
      type: array
      items:
        $ref: '#/TableIndex'
    constraints:
      type: array
      items:
        $ref: '#/TableConstraint'
    alterations:
      type: array
      items:
        $ref: '#/TableAlteration'

TableTypesRequest:
  type: object
  additionalProperties: false
  required: [connectionId]
  properties:
    connectionId:
      type: string
      minLength: 1

TableDdlRequest:
  type: object
  additionalProperties: false
  required: [connectionId, changeSet]
  properties:
    connectionId:
      type: string
      minLength: 1
    changeSet:
      $ref: '#/TableChangeSet'

TableApplyRequest:
  allOf:
    - $ref: '#/TableDdlRequest'
    - type: object
      properties:
        confirmDestructive:
          type: boolean

TableTypeCatalog:
  type: object
  additionalProperties: false
  required: [engine, version, types, capability, rules]
  properties:
    engine:
      type: string
      enum: [postgresql, mysql]
    version:
      type: string
    types:
      type: array
      items:
        $ref: '#/TableType'
    capability:
      $ref: './capability.yaml'
    rules:
      type: object
      additionalProperties: false
      required: [onDelete, onUpdate, maxColumns]
      properties:
        onDelete:
          type: array
          items:
            type: string
            enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
        onUpdate:
          type: array
          items:
            type: string
            enum: [NO ACTION, RESTRICT, CASCADE, SET NULL, SET DEFAULT]
        maxColumns:
          type: integer
          minimum: 1

TableDdlStatement:
  type: object
  additionalProperties: false
  required: [sql]
  properties:
    sql:
      type: string
    warning:
      type: string
    destructiveColumns:
      type: array
      items:
        type: string
    destructiveIndexes:
      type: array
      items:
        type: string
    destructiveConstraints:
      type: array
      items:
        type: string

TableDdlPreview:
  type: object
  additionalProperties: false
  required: [operation, statements, warnings, destructive]
  properties:
    operation:
      type: string
      enum: [create, alter]
    statements:
      type: array
      items:
        $ref: '#/TableDdlStatement'
    warnings:
      type: array
      items:
        type: string
    destructive:
      type: boolean

TableDdlStatementResult:
  type: object
  additionalProperties: false
  required: [index, sql, status]
  properties:
    index:
      type: integer
    sql:
      type: string
    status:
      type: string
      enum: [success, failed, skipped]
    error:
      type: string

TableDdlApplyResult:
  type: object
  additionalProperties: false
  required: [operation, transactional, committed, statements]
  properties:
    operation:
      type: string
      enum: [create, alter]
    transactional:
      type: boolean
    committed:
      type: boolean
    statements:
      type: array
      items:
        $ref: '#/TableDdlStatementResult'
