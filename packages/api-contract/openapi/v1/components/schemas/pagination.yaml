Pagination:
  type: object
  additionalProperties: false
  required:
    - page
    - pageSize
    - total
  properties:
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
    total:
      oneOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: Exact or estimated total, or null when counting is expensive.
PaginatedResponse:
  type: object
  additionalProperties: false
  required:
    - items
    - page
    - pageSize
    - total
  properties:
    items:
      type: array
      items: {}
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
    total:
      oneOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: Exact or estimated total, or null when counting is expensive.
