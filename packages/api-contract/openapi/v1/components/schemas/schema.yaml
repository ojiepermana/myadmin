Schema:
  type: object
  additionalProperties: false
  required: [name, database]
  properties:
    name:
      type: string
      minLength: 1
    database:
      type: string
      minLength: 1
    owner:
      type: string
    isSystem:
      type: boolean
    objectCount:
      type: integer
      minimum: 0

SchemaCreateRequest:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
    owner:
      type: string

SchemaRenameRequest:
  type: object
  additionalProperties: false
  required: [newName]
  properties:
    newName:
      type: string
      minLength: 1

SchemaDropRequest:
  type: object
  additionalProperties: false
  required: [confirmName]
  properties:
    confirmName:
      type: string
      minLength: 1
