ConnectionTlsOptions:
  type: object
  additionalProperties: false
  properties:
    ca:
      type: string
      minLength: 1
      description: Custom CA material. This is transport configuration, not a credential.
    serverName:
      type: string
      minLength: 1

ConnectionInput:
  type: object
  required:
    - label
    - engine
    - host
    - port
    - username
    - sslMode
    - connectTimeoutMs
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 128
    engine:
      type: string
      enum: [postgresql, mysql]
    host:
      type: string
      minLength: 1
      maxLength: 255
    port:
      type: integer
      minimum: 1
      maximum: 65535
    database:
      type: [string, 'null']
    username:
      type: string
      minLength: 1
      maxLength: 128
    sslMode:
      type: string
      enum: [disable, require, verify-ca, verify-full]
    tlsOptions:
      oneOf:
        - $ref: '#/ConnectionTlsOptions'
        - type: 'null'
    connectTimeoutMs:
      type: integer
      minimum: 1
    groupId:
      type: [string, 'null']
    tag:
      type: [string, 'null']
      maxLength: 64
    color:
      type: [string, 'null']
      maxLength: 64

ConnectionCreateRequest:
  allOf:
    - $ref: '#/ConnectionInput'
    - type: object
      required:
        - saveSecret
      properties:
        secret:
          type: string
          format: password
        saveSecret:
          type: boolean
  unevaluatedProperties: false

Connection:
  allOf:
    - $ref: '#/ConnectionInput'
    - type: object
      required:
        - id
        - owner
        - groupId
        - database
        - tlsOptions
        - tag
        - color
        - hasSavedSecret
      properties:
        id:
          type: string
          minLength: 1
        owner:
          $ref: '#/ConnectionOwner'
        groupId:
          type: [string, 'null']
        database:
          type: [string, 'null']
        tlsOptions:
          oneOf:
            - $ref: '#/ConnectionTlsOptions'
            - type: 'null'
        tag:
          type: [string, 'null']
        color:
          type: [string, 'null']
        hasSavedSecret:
          type: boolean
  unevaluatedProperties: false

ConnectionOwner:
  type: object
  additionalProperties: false
  required: [id, username]
  properties:
    id:
      type: string
      minLength: 1
    username:
      type: string
      minLength: 1

ConnectionPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 128
    engine:
      type: string
      enum: [postgresql, mysql]
    host:
      type: string
      minLength: 1
      maxLength: 255
    port:
      type: integer
      minimum: 1
      maximum: 65535
    database:
      type: [string, 'null']
    username:
      type: string
      minLength: 1
      maxLength: 128
    sslMode:
      type: string
      enum: [disable, require, verify-ca, verify-full]
    tlsOptions:
      oneOf:
        - $ref: '#/ConnectionTlsOptions'
        - type: 'null'
    connectTimeoutMs:
      type: integer
      minimum: 1
    groupId:
      type: [string, 'null']
    tag:
      type: [string, 'null']
      maxLength: 64
    color:
      type: [string, 'null']
      maxLength: 64
    secret:
      type: string
      format: password
    clearSecret:
      type: boolean

ConnectionDuplicateRequest:
  type: object
  additionalProperties: false
  required: [newLabel]
  properties:
    newLabel:
      type: string
      minLength: 1
      maxLength: 128
    copySecret:
      type: boolean
      default: false

ConnectionTestRequest:
  oneOf:
    - allOf:
        - $ref: '#/ConnectionInput'
        - type: object
          properties:
            secret:
              type: string
              format: password
      unevaluatedProperties: false
    - type: object
      additionalProperties: false
      required: [connectionId]
      properties:
        connectionId:
          type: string
          minLength: 1

ConnectionTestResponse:
  type: object
  additionalProperties: false
  required: [success, version, latencyMs]
  properties:
    success:
      const: true
    version:
      type: string
      minLength: 1
    latencyMs:
      type: integer
      minimum: 0

ConnectionLifecycleRequest:
  type: object
  additionalProperties: false
  properties:
    secret:
      type: string
      format: password
      description: Transient password used only for this open attempt.

ConnectionLifecycle:
  type: object
  required:
    - connectionId
    - status
    - changedAt
    - serverInfo
    - capability
    - latencyMs
    - errorCategory
    - reason
  properties:
    connectionId:
      type: string
      minLength: 1
    status:
      type: string
      enum: [disconnected, connecting, connected, error]
    changedAt:
      type: string
      format: date-time
    serverInfo:
      oneOf:
        - type: object
          additionalProperties: false
          required: [engine, version]
          properties:
            engine:
              type: string
              enum: [postgresql, mysql]
            version:
              type: string
              minLength: 1
            serverName:
              type: string
        - type: 'null'
    capability:
      oneOf:
        - $ref: './capability.yaml'
        - type: 'null'
    latencyMs:
      oneOf:
        - type: integer
          minimum: 0
        - type: 'null'
    errorCategory:
      oneOf:
        - type: string
          enum:
            - auth_failed
            - connection_failed
            - tls_failed
            - timeout
            - permission_denied
            - not_found
            - conflict
            - syntax_error
            - constraint_violation
            - cancelled
            - unsupported
            - internal
        - type: 'null'
    reason:
      oneOf:
        - type: string
          enum: [idle_closed]
        - type: 'null'

ConnectionLifecycleResponse:
  $ref: '#/ConnectionLifecycle'

ConnectionStatus:
  allOf:
    - $ref: '#/ConnectionLifecycle'
    - type: object
      required: [id, label, engine]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        engine:
          type: string
          enum: [postgresql, mysql]

ConnectionStatusResponse:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ConnectionStatus'

ConnectionStatusInfo:
  type: object
  additionalProperties: false
  required: [connectionId, checkedAt, version, uptimeSeconds, database]
  properties:
    connectionId:
      type: string
      minLength: 1
    checkedAt:
      type: string
      format: date-time
    version:
      type: string
      minLength: 1
    uptimeSeconds:
      oneOf:
        - type: integer
          minimum: 0
        - type: 'null'
    database:
      oneOf:
        - type: string
          minLength: 1
        - type: 'null'

ConnectionPage:
  allOf:
    - $ref: './pagination.yaml#/PaginatedResponse'
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/Connection'
      required: [items]
