type: object
additionalProperties: false
required:
  - code
  - message
  - correlationId
properties:
  code:
    type: string
    minLength: 1
    description: Stable machine readable error code.
    examples:
      - AUTH_INVALID_CREDENTIALS
  message:
    type: string
    minLength: 1
    description: Safe human readable message that never contains secrets.
  correlationId:
    type: string
    minLength: 1
    description: Request correlation identifier generated by the server.
  details:
    type: object
    description: Optional structured safe details. Secrets and raw driver data are excluded.
    additionalProperties: true
