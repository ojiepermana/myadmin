openapi: 3.1.0
info:
  title: Myadmin WebSocket events
  version: 1.0.0
  description: Initial event schemas for the Myadmin WebSocket protocol.
paths: {}
components:
  schemas:
    JobProgressPayload:
      type: object
      additionalProperties: false
      required:
        - jobId
        - progress
      properties:
        jobId:
          type: string
          minLength: 1
        progress:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
    JobStatePayload:
      type: object
      additionalProperties: false
      required:
        - jobId
        - state
      properties:
        jobId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
            - cancelling
            - cancelled
    ConnectionStatusPayload:
      type: object
      additionalProperties: false
      required:
        - connectionId
        - status
      properties:
        connectionId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - connecting
            - connected
            - disconnected
            - error
        changedAt:
          type: string
          format: date-time
        latencyMs:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        errorCategory:
          oneOf:
            - type: string
              enum:
                - auth_failed
                - connection_failed
                - tls_failed
                - timeout
                - permission_denied
                - not_found
                - conflict
                - syntax_error
                - constraint_violation
                - cancelled
                - unsupported
                - internal
            - type: 'null'
        reason:
          oneOf:
            - type: string
              enum:
                - idle_closed
            - type: 'null'
        message:
          type: string
    QueryExecutionPayload:
      type: object
      additionalProperties: false
      required:
        - executionId
        - state
        - transactionActive
        - execution
      properties:
        executionId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - queued
            - running
            - cancelling
            - completed
            - failed
            - cancelled
        durationMs:
          type: integer
          minimum: 0
        transactionActive:
          type: boolean
        execution:
          $ref: ../components/schemas/query.yaml#/QueryExecution
    JobProgressEvent:
      allOf:
        - $ref: ./websocket-protocol.yaml#/components/schemas/WebSocketMessage
        - type: object
          properties:
            type:
              const: event
            event:
              const: job.progress
            payload:
              $ref: '#/components/schemas/JobProgressPayload'
    JobStateEvent:
      allOf:
        - $ref: ./websocket-protocol.yaml#/components/schemas/WebSocketMessage
        - type: object
          properties:
            type:
              const: event
            event:
              const: job.state
            payload:
              $ref: '#/components/schemas/JobStatePayload'
    ConnectionStatusEvent:
      allOf:
        - $ref: ./websocket-protocol.yaml#/components/schemas/WebSocketMessage
        - type: object
          properties:
            type:
              const: event
            event:
              const: connection.status
            payload:
              $ref: '#/components/schemas/ConnectionStatusPayload'
    QueryExecutionEvent:
      allOf:
        - $ref: ./websocket-protocol.yaml#/components/schemas/WebSocketMessage
        - type: object
          properties:
            type:
              const: event
            event:
              const: query.execution
            payload:
              $ref: '#/components/schemas/QueryExecutionPayload'
    WebSocketEvent:
      oneOf:
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/JobStateEvent'
        - $ref: '#/components/schemas/ConnectionStatusEvent'
        - $ref: '#/components/schemas/QueryExecutionEvent'
