openapi: 3.1.0
info:
  title: Myadmin WebSocket protocol
  version: 1.0.0
  description: Shared envelope for Myadmin WebSocket events.
paths: {}
components:
  schemas:
    WebSocketMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - channel
        - payload
        - correlationId
      properties:
        type:
          type: string
          enum:
            - event
            - error
          description: Message kind.
        event:
          type: string
          enum:
            - job.progress
            - job.state
            - connection.status
            - query.execution
          description: Event name for event messages.
        channel:
          type: string
          minLength: 1
          description: Logical subscription channel.
        payload:
          description: Event specific payload.
        correlationId:
          type: string
          minLength: 1
          description: Correlation identifier for the originating request or event.
    RealtimeSubscribeCommand:
      type: object
      additionalProperties: false
      required:
        - type
        - channel
      properties:
        type:
          const: subscribe
        channel:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
    RealtimeUnsubscribeCommand:
      type: object
      additionalProperties: false
      required:
        - type
        - channel
      properties:
        type:
          const: unsubscribe
        channel:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
    RealtimeClientCommand:
      oneOf:
        - $ref: '#/components/schemas/RealtimeSubscribeCommand'
        - $ref: '#/components/schemas/RealtimeUnsubscribeCommand'
    RealtimeErrorPayload:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
