services:
  mysql-8-0:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: myadmin-test-root
      MYSQL_DATABASE: fixture
      MYSQL_USER: fixture
      MYSQL_PASSWORD: myadmin-test-password
    ports:
      - '3380:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pmyadmin-test-root']
      interval: 2s
      timeout: 3s
      retries: 30

  mysql-latest:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: myadmin-test-root
      MYSQL_DATABASE: fixture
      MYSQL_USER: fixture
      MYSQL_PASSWORD: myadmin-test-password
    ports:
      - '3384:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pmyadmin-test-root']
      interval: 2s
      timeout: 3s
      retries: 30
