name: CI

on:
  push:
  pull_request:

concurrency:
  # One run per ref. A newer push cancels the run it supersedes, so a red result
  # is never a stale run and the queue cannot back up (spec 0057 AC-13).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check dependency boundaries
        run: bun run check:boundaries

      - name: Check package manifests
        run: bun run check:manifests

      - name: Run unit tests
        run: bun run test

      - name: Record acceptance test results
        run: bun run matrix:ac:run

      - name: Check the acceptance evidence matrix is current
        # A generated document that is committed needs a gate, or it drifts
        # silently (spec 0057 AC-12).
        run: bun run matrix:ac:check
