name: Contract

on:
  push:
    paths:
      - '.github/workflows/contract.yml'
      - 'packages/api-contract/**'
      - 'scripts/validate-contract.ts'
      - 'scripts/bundle-contract.ts'
      - 'scripts/codegen/**'
      - 'tests/contract/**'
      - 'apps/server/**'
      - 'packages/api-contract/src/generated/**'
      - 'redocly.yaml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/contract.yml'
      - 'packages/api-contract/**'
      - 'scripts/validate-contract.ts'
      - 'scripts/bundle-contract.ts'
      - 'scripts/codegen/**'
      - 'tests/contract/**'
      - 'apps/server/**'
      - 'packages/api-contract/src/generated/**'
      - 'redocly.yaml'
      - 'package.json'
      - 'bun.lock'

concurrency:
  # One run per ref. A newer push cancels the run it supersedes, so a red result
  # is never a stale run and the queue cannot back up (spec 0057 AC-13).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run validate-contract
      - run: bun run bundle:contract
      - run: bun run check:contract-drift
      - run: bun run test:contract
