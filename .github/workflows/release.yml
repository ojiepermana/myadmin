name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

concurrency:
  # A release run is never cancelled halfway; it queues instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run check:manifests
      - run: bun run test

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run validate-contract
      - run: bun run bundle:contract
      - run: bun run check:contract-drift
      - run: bun run test:contract

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test tests/integration/internal-sqlite tests/integration/auth/initial-setup.test.ts tests/integration/connections/connection-manager.test.ts

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run security:scan-secrets
      - run: bun run security:authorization-matrix --check
      - run: bun run validate-contract
      - run: bun run check:contract-drift
      - run: bun run test:security

  build:
    needs: [ci, contract, integration, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            smoke: available
          - target: linux-arm64
            runner: ubuntu-24.04
            smoke: unavailable
          - target: macos-x64
            runner: macos-13
            smoke: available
          - target: macos-arm64
            runner: macos-14
            smoke: available
          - target: windows-x64
            runner: windows-2025
            smoke: unavailable
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:web:release
      - run: bun run embed:web
      - run: bun run build:binaries -- --target=${{ matrix.target }}
      - name: Import macOS Developer ID certificate
        if: startsWith(matrix.target, 'macos-') && env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      - name: Sign and notarize macOS binary
        if: startsWith(matrix.target, 'macos-') && env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/binaries/${{ matrix.target }}/myadmin"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$binary"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/myadmin-${{ matrix.target }}.zip"
          xcrun notarytool submit "$RUNNER_TEMP/myadmin-${{ matrix.target }}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$RUNNER_TEMP/myadmin-${{ matrix.target }}-notary.json"
          grep -q '"status"[[:space:]]*:[[:space:]]*"Accepted"' \
            "$RUNNER_TEMP/myadmin-${{ matrix.target }}-notary.json"
      - name: Verify macOS signature and notarization result
        if: startsWith(matrix.target, 'macos-') && env.MACOS_CERTIFICATE != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/binaries/${{ matrix.target }}/myadmin"
          codesign --verify --deep --strict --verbose=4 "$binary"
          codesign -dv --verbose=4 "$binary" 2>&1 | tee "$RUNNER_TEMP/myadmin-${{ matrix.target }}-codesign.txt"
          grep -q '^TeamIdentifier=' "$RUNNER_TEMP/myadmin-${{ matrix.target }}-codesign.txt"
      - name: Import Windows signing certificate
        if: matrix.target == 'windows-x64' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'myadmin-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign Windows binary
        if: matrix.target == 'windows-x64' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signTool.FullName sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com "dist/binaries/${{ matrix.target }}/myadmin.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool.exe exited with $LASTEXITCODE" }
          & $signTool.FullName verify /pa /all /v "dist/binaries/${{ matrix.target }}/myadmin.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool.exe verification exited with $LASTEXITCODE" }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'myadmin-signing.pfx') -Force -ErrorAction SilentlyContinue
      - name: Record signing status
        shell: bash
        run: |
          status=unsigned
          if [[ "${{ matrix.target }}" == macos-* && "$MACOS_CERTIFICATE" != "" && "$MACOS_CERTIFICATE_PASSWORD" != "" && "$MACOS_SIGNING_IDENTITY" != "" && "$APPLE_ID" != "" && "$APPLE_APP_SPECIFIC_PASSWORD" != "" && "$APPLE_TEAM_ID" != "" ]]; then
            status=signed
          elif [[ "${{ matrix.target }}" == windows-* && "$WINDOWS_CERTIFICATE" != "" && "$WINDOWS_CERTIFICATE_PASSWORD" != "" ]]; then
            status=signed
          fi
          printf 'platform=%s\nsigned=%s\n' "${{ matrix.target }}" "$status" > "dist/binaries/${{ matrix.target }}/signing-status"
          if [[ "$status" == unsigned ]]; then
            echo "${{ matrix.target }} artifact is unsigned; the release notes will include the platform warning." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Smoke binary on matching runner
        if: matrix.smoke == 'available'
        run: bun run smoke:binary -- --binary dist/binaries/${{ matrix.target }}/myadmin
      - name: Record unavailable runner smoke
        if: matrix.smoke == 'unavailable'
        shell: bash
        run: echo "Smoke test unavailable for ${{ matrix.target }} on the configured runner; compilation is still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare target artifact
        shell: bash
        run: cp release/README.md dist/binaries/${{ matrix.target }}/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: myadmin-${{ matrix.target }}
          path: dist/binaries/${{ matrix.target }}

  smoke-linux-database:
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: myadmin-linux-x64
          path: dist/binaries/linux-x64
      - run: chmod +x dist/binaries/linux-x64/myadmin
      - run: bun run smoke:binary -- --binary dist/binaries/linux-x64/myadmin --database-url postgres://postgres:postgres@127.0.0.1:5432/postgres --require-database

  artifacts:
    needs: [build, smoke-linux-database]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: myadmin-*
          path: dist/binaries
          merge-multiple: true
      - run: bun run checksums
      - name: Add size report to summary
        shell: bash
        run: |
          echo '## Release binary sizes' >> "$GITHUB_STEP_SUMMARY"
          bun run release:sizes >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Smoke coverage: linux x64 has a disposable PostgreSQL proof. Matching runner smoke runs on Linux and macOS. Windows and any unavailable runner target are reported as compile only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: myadmin-release-artifacts
          path: |
            dist/binaries
            dist/checksums.txt
          if-no-files-found: error

  docker:
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: myadmin-linux-x64
          path: dist/binaries/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: myadmin-linux-arm64
          path: dist/binaries/linux-arm64
      - name: Prepare Docker binary context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker/amd64 dist/docker/arm64
          cp dist/binaries/linux-x64/myadmin dist/docker/amd64/myadmin
          cp dist/binaries/linux-arm64/myadmin dist/docker/arm64/myadmin
          chmod 0755 dist/docker/amd64/myadmin dist/docker/arm64/myadmin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myadmin:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/myadmin:${{ github.ref_name }}-runtime
      - name: Publish tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker/Dockerfile
          target: tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myadmin:${{ github.ref_name }}-tools

  release:
    needs: [artifacts, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          name: myadmin-release-artifacts
          path: dist
      - name: Create archives and release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for directory in dist/binaries/*; do
            target="$(basename "$directory")"
            tar --exclude='signing-status' -czf "dist/release/myadmin-${target}-${version}.tar.gz" -C "$directory" .
          done
          (cd dist/release && sha256sum *) > dist/checksums.txt
          macos_signed=false
          windows_signed=false
          if compgen -G 'dist/binaries/macos-*/signing-status' > /dev/null && grep -q 'signed=signed' dist/binaries/macos-*/signing-status; then macos_signed=true; fi
          if grep -q 'signed=signed' dist/binaries/windows-x64/signing-status 2>/dev/null; then windows_signed=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "macos_signed=$macos_signed" >> "$GITHUB_OUTPUT"
          echo "windows_signed=$windows_signed" >> "$GITHUB_OUTPUT"
      - name: Generate conventional commit changelog
        env:
          MYADMIN_MACOS_SIGNED: ${{ steps.metadata.outputs.macos_signed }}
          MYADMIN_WINDOWS_SIGNED: ${{ steps.metadata.outputs.windows_signed }}
        run: bun run release:changelog -- --output dist/release-notes.md --tag "${{ github.ref_name }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MyAdmin ${{ steps.metadata.outputs.version }}" \
            --notes-file dist/release-notes.md \
            dist/release/* dist/checksums.txt
