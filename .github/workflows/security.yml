name: Security

on:
  push:
  pull_request:

concurrency:
  # One run per ref. A newer push cancels the run it supersedes, so a red result
  # is never a stale run and the queue cannot back up (spec 0057 AC-13).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan tests and fixtures for secrets
        run: bun run security:scan-secrets

      - name: Check generated authorization matrix
        run: bun run security:authorization-matrix --check

      - name: Validate API contract
        run: bun run validate-contract

      - name: Check contract drift
        run: bun run check:contract-drift

      - name: Run security tests
        run: bun run test:security
