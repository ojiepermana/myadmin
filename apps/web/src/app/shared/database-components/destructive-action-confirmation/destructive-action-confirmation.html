<section class="space-y-5" aria-labelledby="destructive-action-title">
  <div class="space-y-2">
    <p class="text-xs font-semibold uppercase tracking-[0.16em] text-destructive">
      Irreversible action
    </p>
    <h2 id="destructive-action-title" class="text-xl font-semibold">
      {{ actionLabel() }} database
    </h2>
    <p class="text-sm text-muted-foreground">
      This permanently removes <strong class="text-foreground">{{ targetName() }}</strong> from
      <strong class="text-foreground">{{ connectionLabel() }}</strong> ({{ engine() }}).
    </p>
  </div>
  <div class="rounded-md border border-destructive/30 bg-destructive/10 p-4 text-sm">
    <p>Type the database name exactly to continue.</p>
    <label for="destructive-database-name" class="sr-only">Database name confirmation</label>
    <input
      id="destructive-database-name"
      class="mt-3 h-10 w-full rounded-md border border-input bg-background px-3 font-mono text-sm"
      [value]="typedName()"
      (input)="onInput($event)"
      [disabled]="busy()"
      autocomplete="off"
      spellcheck="false"
    />
  </div>
  <div class="flex justify-end gap-2">
    <button Button type="button" variant="outline" (click)="cancelled.emit()" [disabled]="busy()">
      Cancel
    </button>
    <button
      Button
      type="button"
      variant="destructive"
      (click)="confirm()"
      [disabled]="!canConfirm()"
    >
      {{ busy() ? 'Deleting…' : actionLabel() }} database
    </button>
  </div>
</section>
